# prek の設定ファイル (Rust 製の git hook フレームワーク)
# 詳細: https://prek.j178.dev
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]
exclude = { glob = ["dist/**", ".venv/**"] }

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
]

# tombi: TOML のフォーマッタ・リンタ
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.0"
hooks = [
  # uv.lock は自動生成ファイルなので tombi の対象外にする
  { id = "tombi-lint", exclude = { glob = ["**/uv.lock"] } },
  { id = "tombi-format", exclude = { glob = ["**/uv.lock"] } },
]

# ruff: フォーマッタ・リンタ (公式 pre-commit フック)
# rev は Ruff のバージョンに対応する
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.6"
hooks = [
  # --fix 時は check を format より先に実行する
  { id = "ruff-check", args = ["--fix"], priority = 0 },
  { id = "ruff-format", priority = 10 },
]

# ty: 静的型チェッカ (公式 pre-commit フック)
# rev は ty のバージョンに対応する
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.78"
hooks = [
  { id = "ty", priority = 20 },
]

# プロジェクト固有のローカルフック
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "local"

# pytest: 単体テスト
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest"
language = "system"
types = ["python"]
pass_filenames = false
priority = 30
